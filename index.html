<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <title>Document</title>

    
</head>
<body>
    <div class="container">

            
    <div class="row">
        <div class="col-md-6">
            <div class="card mt-4">
                <div class="card-header"><h1>Calculator</h1></div>
                    <div class="card-body">
                        
            
                        <label for="txtFirstNumber" class="form-label">First Number</label>
                        <input type="number" id="txtFirstNumber" class="form-control">
            
                        <label for="txtSecondNumber" class="form-label">Second Number</label>
                        <input type="number" id="txtSecondNumber" class="form-control">
                        


                        
                        <div class="d-flex flex-wrap">
                            <button type="submit" onclick="Add()" class="btn btn-info my-3 mx-2 col-sm mb-2" >Add</button>
                            <button type="submit" onclick="Sub()" class="btn btn-primary my-3 mx-2 col-sm mb-2" >Subtract</button>
                            <button type="submit" onclick="Mul()" class="btn btn-success my-3 mx-2 col-sm mb-2" >Multiply</button>
                            <button type="submit" onclick="Div()" class="btn btn-warning my-3 mx-2 col-sm mb-2" >Divide</button>
                        </div>
                        
                        <!-- <button type="submit" onclick="" class="btn btn-success">Calculate</button>
                        <button type="submit" onclick="" class="btn btn-danger">Calculate</button>
                        <button type="submit" onclick="" class="btn btn-warning">Calculate</button>
                        <button type="submit" onclick="" class="btn btn-secondary">Calculate</button> -->
            
            
                        <label for="txtResult" class="form-label">Result</label>
                        <input type="number" id="txtResult" class="form-control">
                    </div>
                </div>
            </div>
        </div>

    </div>
 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <script src="cal.js"></script>
</body>
</html>
